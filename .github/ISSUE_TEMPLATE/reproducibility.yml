name: Reproducibility issue
description: Report a problem reproducing the pipeline, notebooks or generated outputs.
title: "[reproducibility]: "
labels:
  - reproducibility
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Which command did you run?
      placeholder: make all
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python 3.12, Windows 11
    validations:
      required: true
