name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        run: poetry run pytest

  quality:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff
        run: poetry run ruff check .

      - name: Mypy
        run: poetry run mypy src

  documents:
    name: Build LaTeX Documents
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The Python tests check the documents' structure with regular expressions:
      # that every macro resolves, every citation has an entry, every figure
      # exists. They cannot catch a missing package, a BibTeX error or any other
      # real LaTeX failure. Compiling here closes that gap, so a document that
      # does not build cannot reach main on the strength of passing tests.
      - name: Install a LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra biber

      - name: Build the technical report
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -cd report/report.tex

      - name: Build the manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -cd paper/paper.tex

      # An unresolved reference still compiles. Fail on it explicitly, because a
      # published PDF showing "??" is a defect the exit code would otherwise hide.
      - name: Reject unresolved citations and references
        run: |
          status=0
          for log in report/report.log paper/paper.log; do
            if grep -Eq "Citation .* undefined|Reference .* undefined|There were undefined references" "$log"; then
              echo "Unresolved references in $log:"
              grep -E "Citation .* undefined|Reference .* undefined" "$log" || true
              status=1
            fi
          done
          exit $status

      # The documents claim to be deterministic outputs of a deterministic pipeline,
      # and the committed PDFs are only meaningful if that holds. pdfTeX defaults to
      # stamping each build with timestamps and a random identifier, which the
      # preambles suppress; this step is what keeps that suppression working.
      - name: Rebuild and require byte-identical PDFs
        run: |
          for doc in report paper; do
            sha256sum "$doc/$doc.pdf" > "/tmp/$doc.before"
          done
          latexmk -pdf -interaction=nonstopmode -halt-on-error -g -cd report/report.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error -g -cd paper/paper.tex
          status=0
          for doc in report paper; do
            if ! sha256sum -c "/tmp/$doc.before" --quiet; then
              echo "$doc.pdf is not reproducible: a rebuild from identical inputs differs."
              echo "Check that the preamble still suppresses pdfTeX metadata."
              status=1
            fi
          done
          exit $status

      - name: Upload the built PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documents
          path: |
            report/report.pdf
            paper/paper.pdf
          if-no-files-found: error
