[project]
name = "portugal-fiscal-balance"
version = "0.2.0"
description = "Reproducible empirical analysis of Portugal's general-government balance by subsector, 1977-2025."
authors = [{ name = "Diogo Ribeiro", email = "diogo_dj@hotmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = [
  "portugal",
  "fiscal-policy",
  "public-finance",
  "government-finance",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<2.5",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.9,<4",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
  "statsmodels>=0.14,<1",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/portugal-fiscal-balance"
Repository = "https://github.com/DiogoRibeiro7/portugal-fiscal-balance"
Issues = "https://github.com/DiogoRibeiro7/portugal-fiscal-balance/issues"

[tool.poetry]
packages = [{ include = "portugal_fiscal_balance", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
nbformat = ">=5.10,<6"
nbclient = ">=0.10,<1"
jupyter = ">=1,<2"
ruff = ">=0.8,<1"
mypy = ">=1.13,<2"
pandas-stubs = ">=2.2,<3"
# render.py reads config/sources.yml. Without the stub, mypy fails in CI while
# passing locally wherever the stub happens to be installed.
types-PyYAML = ">=6,<7"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "statsmodels.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
