# `vintage` is the publication date of the retained file, not the last year it
# covers. It matters because the most recent years of every modern source are
# still provisional: the same year restated from a later vintage will differ.
sources:
  banco_portugal_long_series:
    institution: Banco de Portugal / INE
    coverage: 1977-1995 for the historical segment used here
    vintage: 2023-12
    url: https://www.bportugal.pt/sites/default/files/documents/2023-12/series-longas-para-economia-portuguesa-pos-ii-guerra-mundial.xlsx
    local_file: data/raw/banco_portugal/series_longas_2023-12.xlsx
    notes: Historical subsector accounts, balances, transfers, GDP and labour-market series.

  pordata_balance_by_level:
    institution: INE via PORDATA
    coverage: 1995-2025
    vintage: 2026-04
    url: https://www.pordata.pt/en/portugal/general+government+net+lending+net+borrowing+by+level+of+administration-2785
    local_file: data/raw/pordata/pordata_2785_balance_by_level_1995_2025.csv
    notes: Continuous modern bridge for the four B.9 balances; 2024-2025 are flagged provisional at source.

  cfp_annual_general_government:
    institution: Portuguese Public Finance Council (CFP)
    coverage: 1995-2025
    vintage: 2026-04-15
    url: https://www.cfp.pt/uploads/subcanais2_ficheiros/15042026_estatfp_sec2010_anual_cfp.xlsx
    local_file: data/raw/cfp/cfp_sec2010_annual_general_government_2026-04-15.xlsx
    notes: ESA 2010 revenue, expenditure, balance, interest, investment, debt and stock-flow adjustment.

  cfp_annual_subsectors:
    institution: Portuguese Public Finance Council (CFP)
    coverage: 2000-2025
    vintage: 2026-04-15
    url: https://www.cfp.pt/uploads/subcanais2_ficheiros/15042026_estatfp_sec2010_anual_subsectores_cfp.xlsx
    local_file: data/raw/cfp/cfp_sec2010_annual_subsectors_2026-04-15.xlsx
    notes: ESA 2010 Central, Regional/Local and Social Security Funds accounts.

  eurostat_subsector_balances:
    institution: Eurostat
    coverage: 1995-2025, EU and EFTA reporters, B9 by subsector
    vintage: 2026-07-21
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/gov_10a_main/A.PC_GDP+MIO_NAC.S13+S1311+S1312+S1313+S1314.B9.?format=SDMX-CSV&startPeriod=1995
    local_file: data/raw/eurostat/eurostat_gov_10a_main_b9_by_sector_2026-07-21.csv
    notes: >-
      Harmonised subsector net lending/borrowing used only for the European benchmark.
      Retained as returned by the dissemination API, including observation flags. The
      Portuguese rows agree with the domestic panel to rounding, which makes this an
      independent check on the extraction as well as a comparison set.

  ine_wage_bill:
    institution: Statistics Portugal (INE) via Eurostat
    coverage: 1995-2025, total economy
    vintage: 2026-08-17
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/nama_10_a10/A.CP_MEUR.TOTAL.D1+D11.PT?format=SDMX-CSV&startPeriod=1995
    local_file: data/raw/eurostat/eurostat_nama_10_a10_wage_bill_pt_2026-08-17.csv
    notes: >-
      Wages and salaries (D.11) and compensation of employees (D.1) for the total
      economy. These are the Portuguese national accounts compiled by INE and
      transmitted to Eurostat; the Eurostat endpoint is used because it is versioned
      and programmatically stable, not because the compiler differs.

  ine_employment:
    institution: Statistics Portugal (INE) via Eurostat
    coverage: 1995-2025, total economy
    vintage: 2026-08-17
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/nama_10_a10_e/A.THS_PER.TOTAL.SAL_DC+EMP_DC.PT?format=SDMX-CSV&startPeriod=1995
    local_file: data/raw/eurostat/eurostat_nama_10_a10_e_employment_pt_2026-08-17.csv
    notes: >-
      Employees and total employment, domestic concept, in thousands of persons.
      Employees are the head count behind the wage bill, so the two files together
      give the contribution base and its split into employment and average wages.

  cfp_social_security_detail:
    institution: Portuguese Public Finance Council (CFP)
    coverage: 2019-2025 systems; detailed 2024-2025 tables
    vintage: 2026-04
    url: https://www.cfp.pt/uploads/publicacoes_ficheiros/cfp-rel-04-2026-ds.xlsx
    local_file: data/raw/cfp/cfp_rel_04_2026_social_security_underlying_data.xlsx
    notes: Internal Social Security budget decomposition used separately from national accounts.
